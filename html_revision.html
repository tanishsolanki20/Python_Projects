<B>Correct Your Posture While using Computer</B> </P>

<P style=text-align:justify>

You should maintain a proper

sitting

posture while using a computer.

Level

Following are a few simple points that

you can follow to improve your posture:

</P>

<UL>

<LI> Maintain a distance of at least 20 inches from the screen.</LI>

<LI> Set the chair's height so your feet are flat on the ground.</LI> <LI> Sit straight on the chair.</LI>

<LI> Look forward to avoid any kind of strain or pain in the neck.</LI> <LI> Level your eyes higher than the center of the screen.</LI>

</UL>
